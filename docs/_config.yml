title: Update CLI
description: Reliable project updates, setup and deployment
url: "https://r14r.github.io"
baseurl: "/update-cli"
project:
  name: Update CLI
  url: "https://github.com/r14r/update-cli"
author:
  name: r14r
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: default
locale: en
markdown: kramdown
permalink: pretty
search: true
plugins:
  - jekyll-include-cache
sass:
  quiet_deps: true
defaults:
  - scope:
      path: ""
    values:
      layout: single
      toc: true
      toc_label: "On this page"
      toc_sticky: true
      sidebar:
        nav: docs
exclude:
  - Gemfile
  - Gemfile.lock
  - tapes
  - examples
  - vendor
  - _site

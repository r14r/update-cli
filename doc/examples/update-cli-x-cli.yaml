schemaVersion: 1

project:
  name: x-cli
  type: go
  description: x-cli prüfen, testen und bauen

steps:
  - id: gofmt
    name: Go-Quellcode formatieren
    when: file:go.mod
    run: |
      gofmt -w cmd internal

  - id: go-mod-download
    name: Go-Module laden
    when: file:go.mod
    run: |
      go mod download

  - id: go-vet
    name: Go-Quellcode prüfen
    when: file:go.mod
    run: |
      go vet ./...

  - id: go-test
    name: Go-Tests ausführen
    when: file:go.mod
    run: |
      go test ./...

  - id: go-build
    name: x-cli bauen
    when: file:go.mod
    run: |
      VERSION="$(tr -d '[:space:]' < VERSION)"
      COMMIT="$(git rev-parse --short HEAD 2>/dev/null || printf 'local')"
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      MODULE="$(go list -m)"

      mkdir -p bin

      go build \
        -trimpath \
        -ldflags "-s -w \
          -X ${MODULE}/internal/version.Version=${VERSION} \
          -X ${MODULE}/internal/version.Commit=${COMMIT} \
          -X ${MODULE}/internal/version.Date=${BUILD_DATE}" \
        -o bin/x-cli \
        ./cmd/x-cli

      chmod 0755 bin/x-cli

  - id: binary-version-check
    name: Binary-Version prüfen
    when: file:bin/x-cli
    run: |
      VERSION="$(tr -d '[:space:]' < VERSION)"
      OUTPUT="$(./bin/x-cli --version)"

      printf '%s\n' "${OUTPUT}"
      printf '%s\n' "${OUTPUT}" | grep -F "${VERSION}" >/dev/null

  - id: doctor
    name: x-cli Doctor ausführen
    when: file:bin/x-cli
    run: |
      ./bin/x-cli doctor

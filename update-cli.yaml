schemaVersion: 2

project:
  slug: update-cli
  name: Update CLI
  description: Update CLI prüfen, testen, bauen und deployen

update:
  mode: pull
  source:
    type: repository
    repository: https://github.com/r14r/update-cli.git
    ref: main
  releaseDir: release
  currentDir: current
  backup:
    directory: backup
    keep: 3
  retention:
    releases: 5
  sync:
    preserve:
      - .git/
      - .gitignore
      - .venv/
      - .env
      - .env.*
      - data/
      - storage/
      - uploads/
      - media/
      - logs/
      - var/
    keepOnSetupError: false
  docker:
    lifecycle: auto
  healthcheck:
    type: none

defaults:
  timeout: 15m
  failFast: true

variables:
  distDir: dist
  binary: update-cli
  deployPath: "{{ env.UPDATE_CLI_DEPLOY_PATH | /usr/local/bin/update-cli }}"
  configDir: "{{ env.UPDATE_CLI_CONFIG_PATH | /usr/local/etc/update-cli }}"

requirements:
  commands:
    - go
  optionalCommands:
    - just

# A no-argument invocation updates source and prompts for bootstrap/install;
# configure "no parameter": ["update", "no-bootstrap", "no-install"]
# in .update-cli/config.json to suppress both prompts.
run:
  description: Start the built Update CLI
  cwd: .
  steps:
    - name: Show Update CLI help
      command:
        exec: ./dist/update-cli
        args:
          - --help

workflows:
  bootstrap:
    description: Entwicklungsumgebung mit just bootstrap vorbereiten
    tasks:
      - bootstrap
  setup:
    description: Projektumgebung vorbereiten ohne Build oder Installation
    tasks:
      - bootstrap
  ci:
    description: Formatieren, linten, Pre-Commit prüfen, testen, bauen und verifizieren
    tasks:
      - verify
  build:
    description: Projekt mit just build erstellen
    tasks:
      - just-build
  clean:
    description: Generierte Dateien entfernen
    tasks:
      - clean

tasks:
  bootstrap:
    description: Python-Venv, Go-Module und Git-Hooks einrichten
    steps:
      - id: just-bootstrap
        name: just bootstrap ausführen
        shell: |
          command -v just >/dev/null 2>&1 || { echo "just ist für bootstrap erforderlich" >&2; exit 1; }
          just bootstrap

  just-build:
    description: Justfile als kanonischen Build-Einstiegspunkt verwenden
    steps:
      - id: invoke-just-build
        name: just build ausführen
        shell: |
          command -v just >/dev/null 2>&1 || { echo "just ist für build erforderlich" >&2; exit 1; }
          just build

  prepare:
    description: Go-Abhängigkeiten vorbereiten
    steps:
      - id: go-mod-download
        name: Go-Module laden
        go:
          action: mod-download
        when:
          fileExists: go.mod

  format:
    description: Go-Quellcode formatieren
    requires:
      - prepare
    steps:
      - id: gofmt-write
        name: Go-Dateien formatieren
        shell: gofmt -w .

  check:
    description: Quellcode linten, statisch prüfen und testen
    requires:
      - format
    steps:
      - id: gofmt
        name: Go-Formatierung prüfen
        shell: |
          out="$(gofmt -l .)"
          test -z "$out" || { printf '%s\n' "$out"; exit 1; }

      - id: go-vet
        name: Go-Quellcode prüfen
        go:
          action: vet

      - id: go-test
        name: Go-Tests ausführen
        go:
          action: test

      - id: go-test-race
        name: Race-Tests ausführen
        go:
          action: test
          args: [-race]
        when:
          os: [darwin, linux]

  precommit:
    description: Alle verpflichtenden Pre-Commit-Checks ausführen
    requires:
      - check
    steps:
      - id: precommit-checks
        name: Pre-Commit-Checks
        shell: bash scripts/precommit.sh --commit

  build:
    description: Update CLI Binary bauen
    requires:
      - precommit
    steps:
      - id: build
        name: Update CLI bauen
        shell: |
          ./scripts/validate-version.sh . >/dev/null
          mkdir -p "{{ distDir }}"
          go build -trimpath \
            -ldflags "-s -w" \
            -o "{{ distDir }}/{{ binary }}" \
            .

  verify:
    description: Gebautes Binary validieren
    requires:
      - build
    steps:
      - id: binary-exists
        name: Binary prüfen
        assert:
          executable: "{{ distDir }}/{{ binary }}"

      - id: binary-version
        name: Binary-Version prüfen
        shell: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUTPUT="$(./{{ distDir }}/{{ binary }} version)"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -F "$VERSION" >/dev/null

  deploy:
    description: Binary und globales Setup-Template installieren
    requires:
      - verify
    steps:
      - id: config-dir
        name: Globalen Konfigurationsordner vorbereiten
        shell: |
          mkdir -p "{{ configDir }}"

      - id: setup-template
        name: Globales Setup-TUI-Template installieren
        deploy:
          source: setup-template.sh
          target: "{{ configDir }}/setup-template.sh"
          mode: "0755"
        when:
          fileExists: setup-template.sh

      - id: prompt-dir
        name: Globalen Prompt-Ordner vorbereiten
        shell: |
          mkdir -p "{{ configDir }}/prompts"

      - id: setup-script-ai-prompt
        name: AI-Prompt für setup.sh-Konvertierung installieren
        deploy:
          source: prompts/setup-script-to-yaml.txt
          target: "{{ configDir }}/prompts/setup-script-to-yaml.txt"
          mode: "0644"
        when:
          fileExists: prompts/setup-script-to-yaml.txt

      - id: ai-config-example
        name: AI-Konfigurationsbeispiel installieren
        deploy:
          source: doc/examples/ai.json
          target: "{{ configDir }}/ai.json.example"
          mode: "0644"
        when:
          fileExists: doc/examples/ai.json

      - id: deploy-binary
        name: Update CLI deployen
        deploy:
          source: "{{ distDir }}/{{ binary }}"
          target: "{{ deployPath }}"
          mode: "0755"
        when:
          fileExists: "{{ distDir }}/{{ binary }}"

  install:
    description: Geprüftes Binary installieren und die Installation verifizieren
    requires:
      - verify
    steps:
      - id: just-install
        name: just install ausführen
        shell: |
          command -v just >/dev/null 2>&1 || { echo "just ist für das Update-CLI-Setup erforderlich" >&2; exit 1; }
          # UPDATE_CLI_SETUP_RUNNING ist ein interner Marker des Setup-Runners.
          # Er darf den verschachtelten Installationsprozess nicht beeinflussen.
          unset UPDATE_CLI_SETUP_RUNNING
          exec just install

      - id: installed-binary-smoke
        name: Installiertes Binary auf Version und Startfähigkeit prüfen
        shell: |
          destination="${INSTALL_DIR:-/usr/local/bin}/update-cli"
          test -x "$destination" || { echo "Installiertes Binary fehlt: $destination" >&2; exit 1; }
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUTPUT="$("$destination" version)"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -F "$VERSION" >/dev/null
          "$destination" --help >/dev/null

  clean:
    description: Build-Artefakte entfernen
    steps:
      - id: remove-build-output
        name: Build-Ausgabe entfernen
        remove:
          paths: [dist, update-cli]
          recursive: true

name: Apply source sync

on:
  push:
    branches: [main]
    paths:
      - '.sync/trigger-note.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply staged source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .sync/update-cli-source.tar.gz.b64 > /tmp/update-cli-source.tar.gz

          rm -f setup.yaml
          rm -f doc/examples/setup-docker.yaml
          rm -f doc/examples/setup-go.yaml
          rm -f doc/examples/setup-python.yaml
          rm -f doc/examples/setup-x-cli.yaml

          tar -xzf /tmp/update-cli-source.tar.gz -C .

          rm -rf .sync
          rm -f .github/workflows/source-sync.yml

      - name: Commit release 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Release 1.3.0'
          git push origin HEAD:main

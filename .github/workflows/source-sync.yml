name: Apply source sync

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply staged 1.3.1 source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/v131-*.b64 > /tmp/update-cli-v1.3.1-source-diff.b64
          base64 -d /tmp/update-cli-v1.3.1-source-diff.b64 > /tmp/update-cli-v1.3.1-source-diff.tar.gz

          rm -f setup.yaml
          rm -f doc/examples/setup-docker.yaml
          rm -f doc/examples/setup-go.yaml
          rm -f doc/examples/setup-python.yaml
          rm -f doc/examples/setup-x-cli.yaml

          tar -xzf /tmp/update-cli-v1.3.1-source-diff.tar.gz -C .

          rm -rf .sync
          rm -f .github/workflows/source-sync.yml

      - name: Commit release 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Release 1.3.1'
          git push origin HEAD:main

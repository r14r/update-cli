name: Apply source sync

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.issue.number == 3 && github.event.comment.body == 'apply staged source sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply staged 1.3.1 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/patch-v131-*.b64 > /tmp/v131.patch.gz.b64
          base64 -d /tmp/v131.patch.gz.b64 > /tmp/v131.patch.gz
          gzip -dc /tmp/v131.patch.gz > /tmp/v131.patch

          git apply --binary --check /tmp/v131.patch
          git apply --binary /tmp/v131.patch

          rm -rf .sync
          rm -f .github/workflows/source-sync.yml

      - name: Commit release 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Release 1.3.1'
          git push origin HEAD:main

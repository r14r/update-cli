name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-release:
    if: github.head_ref == 'sync-1.3.1-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply staged 1.3.1 source patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v131.patch.gz
          while IFS= read -r chunk; do
            echo "decode ${chunk}"
            base64 -d "${chunk}" >> /tmp/v131.patch.gz
          done < <(find .sync -maxdepth 1 -type f -name 'patch-v131-*.b64' -print | sort)

          gzip -t /tmp/v131.patch.gz
          gzip -dc /tmp/v131.patch.gz > /tmp/v131.patch
          git apply --binary --check /tmp/v131.patch
          git apply --binary /tmp/v131.patch

          rm -rf .sync
          rm -f .github/workflows/source-sync.yml

      - name: Commit release 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 1.3.1'
          git push origin HEAD:main

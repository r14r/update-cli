name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Shell syntax
        run: |
          bash -n setup.sh
          bash -n setup-template.sh
      - name: Justfile shell escaping
        run: |
          if grep -n '\$\$' justfile; then
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath -o dist/update-cli .
      - name: Setup schema v2 catalog
        run: ./dist/update-cli --setup-list --no-ui
      - name: Fullscreen TUI smoke
        run: python3 tests/tui_smoke.py

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p dist
      - run: GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/update-cli-darwin-amd64 .
      - run: GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/update-cli-darwin-arm64 .
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o dist/update-cli-linux-amd64 .

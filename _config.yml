theme: jekyll-theme-minimal

# Site settings
title: update-cli
description: A CLI tool for managing updates
url: https://r14r.github.io/update-cli
repository: r14r/update-cli

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude files
exclude:
  - .gitignore
  - .release-*
  - build-config.json
  - cmd/
  - lib/
  - justfile
  - go.mod
  - main.go
  - main_test.go
  - setup.sh
